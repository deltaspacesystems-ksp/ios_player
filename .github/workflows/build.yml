name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild -project Lumen.xcodeproj -scheme Lumen -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qr Lumen.ipa Payload
      - name: Generate SideStore source
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/latest"
          SIZE=$(stat -f%z Lumen.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VER="1.0.${{ github.run_number }}"
          jq -n --arg base "$BASE" --arg icon "https://raw.githubusercontent.com/${REPO}/main/icon.png"             --argjson size "$SIZE" --arg date "$DATE" --arg ver "$VER" '{
            name: "Lumen Source", identifier: "dev.lumen.source",
            sourceURL: ($base + "/source.json"),
            apps: [{
              name: "Lumen", bundleIdentifier: "dev.lumen.player", developerName: "Lumen",
              subtitle: "Audio & video player", localizedDescription: "Liquid Glass player with crossfade and music haptics.",
              iconURL: $icon, tintColor: "FF2D78",
              downloadURL: ($base + "/Lumen.ipa"), size: $size, version: $ver, versionDate: $date,
              versionDescription: "Automatic build",
              versions: [{version: $ver, date: $date, size: $size, downloadURL: ($base + "/Lumen.ipa"), localizedDescription: "Automatic build", minOSVersion: "26.0"}]
            }], news: []}' > source.json
      - name: Publish IPA release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lumen.ipa source.json --title "Lumen (latest build)" --notes "Commit ${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish build report
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir ../report && cd ../report
          git init -q -b build-logs
          git config user.email "ci@lumen"; git config user.name "ci"
          echo "status=$STATUS" > status.txt
          echo "sha=${GITHUB_SHA}" >> status.txt
          grep -E "error:|warning: .*(Sendable|isolat)|BUILD (FAILED|SUCCEEDED)|xcodegen|Error" "$GITHUB_WORKSPACE/build.log" | sort -u | head -150 > errors.txt || true
          tail -n 150 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          git add -A; git commit -q -m "report ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
