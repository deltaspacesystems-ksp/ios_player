name: Build VLC fork
on:
  push:
    branches: [vlc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: bash scripts/build_vlc.sh 2>&1 | tee build.log
      - name: Generate SideStore source
        if: success()
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/vlc-latest"
          SIZE=$(stat -f%z Lumen-VLC.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VER="4.0.${{ github.run_number }}"
          jq -n --arg base "$BASE" --arg icon "https://raw.githubusercontent.com/${REPO}/main/icon.png" --argjson size "$SIZE" --arg date "$DATE" --arg ver "$VER" '{
            name: "Lumen Source", identifier: "dev.lumen.source",
            sourceURL: ($base + "/source.json"),
            apps: [{
              name: "Lumen", bundleIdentifier: "dev.lumen.player", developerName: "Lumen (VLC for iOS 4 + Lumen)",
              subtitle: "VLC for iOS, plus crossfade, haptics, DJ and mixes", localizedDescription: "The real VLC for iOS 4 with Lumen features added on top.",
              iconURL: $icon, tintColor: "FF8800",
              downloadURL: ($base + "/Lumen-VLC.ipa"), size: $size, version: $ver, versionDate: $date,
              versionDescription: "Automatic build",
              versions: [{version: $ver, date: $date, size: $size, downloadURL: ($base + "/Lumen-VLC.ipa"), localizedDescription: "Automatic build", minOSVersion: "26.0"}]
            }], news: []}' > source.json
      - name: Publish IPA release
        if: success()
        run: |
          gh release delete vlc-latest --yes --cleanup-tag || true
          gh release create vlc-latest Lumen-VLC.ipa Lumen-VLC-noext.ipa source.json --title "Lumen (VLC for iOS 4 + Lumen), latest build" --notes "Commit ${GITHUB_SHA}. Lumen-VLC-noext.ipa = same app without share extension / widget (fewer App IDs)." --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish build report
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir ../report && cd ../report
          git init -q -b build-logs-vlc
          git config user.email "ci@lumen"; git config user.name "ci"
          echo "status=$STATUS" > status.txt
          echo "sha=${GITHUB_SHA}" >> status.txt
          grep -E "error:|BUILD (FAILED|SUCCEEDED)|\[!\]|fatal:|ERROR|Could not|failed" "$GITHUB_WORKSPACE/build.log" | sort -u | head -150 > errors.txt || true
          tail -n 120 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          head -n 160 "$GITHUB_WORKSPACE/build.log" > head.txt || true
          grep -n "Lumen" "$GITHUB_WORKSPACE/build.log" | cut -c1-300 | head -80 > lumen.txt || true
          git add -A; git commit -q -m "report ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs-vlc
