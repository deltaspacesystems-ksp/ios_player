name: Build VLC fork
on:
  push:
    branches: [vlc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: bash scripts/build_vlc.sh 2>&1 | tee build.log
      - name: Publish IPA release
        if: success()
        run: |
          gh release delete vlc-latest --yes --cleanup-tag || true
          gh release create vlc-latest Lumen-VLC.ipa --title "Lumen (VLC fork, latest build)" --notes "Commit ${GITHUB_SHA}" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish build report
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir ../report && cd ../report
          git init -q -b build-logs-vlc
          git config user.email "ci@lumen"; git config user.name "ci"
          echo "status=$STATUS" > status.txt
          echo "sha=${GITHUB_SHA}" >> status.txt
          grep -E "error:|BUILD (FAILED|SUCCEEDED)|\[!\]|fatal:|ERROR|Could not|failed" "$GITHUB_WORKSPACE/build.log" | sort -u | head -150 > errors.txt || true
          tail -n 120 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          head -n 160 "$GITHUB_WORKSPACE/build.log" > head.txt || true
          grep -n "Lumen" "$GITHUB_WORKSPACE/build.log" | cut -c1-300 | head -80 > lumen.txt || true
          git add -A; git commit -q -m "report ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs-vlc
