name: Build VLC fork
on:
  push:
    branches: [vlc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      WITH_LUMEN: "0"   # 0 = pristine VLC, 1 = VLC + Lumen tab
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: bash scripts/build_vlc.sh 2>&1 | tee build.log
      - name: Generate SideStore source
        if: success()
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/vlc-latest"
          if [ "$WITH_LUMEN" = "1" ]; then OUT=Lumen-VLC; BID=dev.lumen.player; NAME=Lumen; SUB="VLC for iOS, plus crossfade, haptics, DJ and mixes"; else OUT=VLC; BID=dev.lumen.vlc; NAME=VLC; SUB="VLC for iOS 4 (unmodified build)"; fi
          SIZE=$(stat -f%z $OUT.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VER="4.0.${{ github.run_number }}"
          jq -n --arg base "$BASE" --arg icon "https://raw.githubusercontent.com/${REPO}/main/icon.png" --argjson size "$SIZE" --arg date "$DATE" --arg ver "$VER" --arg out "$OUT" --arg bid "$BID" --arg name "$NAME" --arg sub "$SUB" '{
            name: "Lumen Source", identifier: "dev.lumen.source",
            sourceURL: ($base + "/source.json"),
            apps: [{
              name: $name, bundleIdentifier: $bid, developerName: "VideoLAN (unofficial build)",
              subtitle: $sub, localizedDescription: "VLC for iOS 4 built from the official source.",
              iconURL: $icon, tintColor: "FF8800",
              downloadURL: ($base + "/" + $out + ".ipa"), size: $size, version: $ver, versionDate: $date,
              versionDescription: "Automatic build",
              versions: [{version: $ver, date: $date, size: $size, downloadURL: ($base + "/" + $out + ".ipa"), localizedDescription: "Automatic build", minOSVersion: "26.0"}]
            }], news: []}' > source.json
      - name: Publish IPA release
        if: success()
        run: |
          if [ "$WITH_LUMEN" = "1" ]; then OUT=Lumen-VLC; else OUT=VLC; fi
          gh release delete vlc-latest --yes --cleanup-tag || true
          gh release create vlc-latest $OUT.ipa $OUT-noext.ipa source.json --title "$OUT latest build" --notes "Commit ${GITHUB_SHA}. $OUT-noext.ipa = same app without share extension / widget (fewer App IDs)." --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish build report
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir ../report && cd ../report
          git init -q -b build-logs-vlc
          git config user.email "ci@lumen"; git config user.name "ci"
          echo "status=$STATUS" > status.txt
          echo "sha=${GITHUB_SHA}" >> status.txt
          grep -E "error:|BUILD (FAILED|SUCCEEDED)|\[!\]|fatal:|ERROR|Could not|failed" "$GITHUB_WORKSPACE/build.log" | sort -u | head -150 > errors.txt || true
          tail -n 120 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          head -n 160 "$GITHUB_WORKSPACE/build.log" > head.txt || true
          grep -n "Lumen" "$GITHUB_WORKSPACE/build.log" | cut -c1-300 | head -80 > lumen.txt || true
          git add -A; git commit -q -m "report ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs-vlc
