name: Lumen
options:
  bundleIdPrefix: dev.lumen
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit
    exactVersion: 4.0.0-a22
targets:
  Lumen:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lumen.player
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        NSLocalNetworkUsageDescription: Lumen browses your local network for media servers (SMB, FTP, UPnP) and Chromecast devices.
        NSBonjourServices:
          - _smb._tcp
          - _ftp._tcp
          - _sftp-ssh._tcp
          - _nfs._tcp
          - _http._tcp
          - _googlecast._tcp
          - _airplay._tcp
        NSMicrophoneUsageDescription: Lumen listens through the microphone only when you ask it to identify a song with Shazam.
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
